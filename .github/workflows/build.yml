name: APK build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Mesevetito.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mesevetito
          path: Mesevetito.apk

      # Állandó letöltési link: Releases → "latest"
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Legfrissebb build
          body: "Build: ${{ github.sha }}"
          prerelease: true
          files: Mesevetito.apk
