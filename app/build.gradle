plugins {
    id 'com.android.application'
}

android {
    namespace 'hu.pihokker.mesevetito'
    compileSdk 34

    defaultConfig {
        applicationId 'hu.pihokker.mesevetito'
        minSdk 26
        // 30 = Android 11, a projektor rendszere
        targetSdk 30
        // GitHub Actions futásszám → minden build újabb verzió, frissítésként települ
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Állandó aláíró kulcs: így az új verzió a régi fölé települ (saját, privát app)
    signingConfigs {
        release {
            storeFile file('mesevetito.jks')
            storePassword 'mesevetito'
            keyAlias 'mesevetito'
            keyPassword 'mesevetito'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // Saját app, nem megy Play Store-ba: a Play-szabályt nem kérjük számon
    lint {
        disable 'ExpiredTargetSdkVersion'
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
